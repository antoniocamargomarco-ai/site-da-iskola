<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo Tela Cheia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Impede interações do usuário com o iframe */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .voltar {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            color: #fff;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        .voltar:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1" class="voltar">&larr; Voltar para a página inicial</a>

    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/l8gqhvndkiU?autoplay=1&mute=1&loop=1&playlist=l8gqhvndkiU&controls=0&disablekb=1&modestbranding=1" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
